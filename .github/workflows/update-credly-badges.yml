name: Update Credly Badges in README

on:
  schedule:
    - cron: "0 14 * * *"   # every Monday at 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update badges
        id: badges
        env:
          CREDLY_USERNAME: ${{ vars.CREDLY_USERNAME }}
        run: python scripts/update_credly_badges.py

      - name: Commit and push if changed
        if: steps.badges.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Credly badges in README"
          file_pattern: README.md
